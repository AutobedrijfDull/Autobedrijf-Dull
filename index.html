<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autobedrijf Dull | Planning</title>
<style>
:root{--red:#d71920;--dark:#0d0e10;--panel:#181a1d;--line:#303338;--text:#f5f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(#151515,#090909);border-bottom:1px solid #292929;position:sticky;top:0;z-index:5}.nav{max-width:1180px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{width:145px;height:58px;object-fit:contain;border-radius:6px}nav{display:flex;gap:7px;flex:1;justify-content:center}nav button{background:transparent;color:#ddd;border:0;padding:11px 14px;border-radius:8px;font-weight:700;font-size:15px}nav button.active,nav button:hover{background:var(--red);color:#fff}
main{max-width:1180px;margin:auto;padding:24px 18px 50px}.hero{min-height:185px;border-radius:18px;padding:30px;display:flex;align-items:end;background:radial-gradient(circle at 20% 30%,#3a3c3f,#161719 58%,#080808);border:1px solid #303030}
.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.hero p{margin:0;color:#d0d0d0;font-size:17px}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}h2{margin:0 0 15px}label{display:block;color:#d4d4d4;font-size:13px;font-weight:700;margin:11px 0 6px}
input,select,textarea{width:100%;background:#24272b;color:#fff;border:1px solid #3b3f45;border-radius:9px;padding:11px;font-size:15px}textarea{min-height:85px}.btn{width:100%;border:0;border-radius:9px;padding:12px;margin-top:14px;background:var(--red);color:#fff;font-weight:800}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar button{border:1px solid #444;background:#24272b;color:#fff;border-radius:8px;padding:8px 12px}
.calendar{display:grid;grid-template-columns:70px repeat(5,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#121416;margin-top:12px}.cell{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;font-size:12px}.head{min-height:48px;text-align:center;font-weight:800;background:#1d2024}.time{color:#9da2a8;text-align:right;background:#151719}
.appt{background:var(--red);border-radius:8px;padding:7px;color:#fff;font-weight:700}.appt small{display:block;font-weight:500;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#181a1d;border:1px solid var(--line);border-radius:12px;padding:14px}.stat strong{font-size:25px;display:block}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:650px}th,td{padding:11px 8px;border-bottom:1px solid #303338;text-align:left}th{color:#aaa}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#1f8f4d;color:#fff;font-size:12px;font-weight:700}
@media(max-width:850px){.layout{grid-template-columns:1fr}.nav{justify-content:center}nav{order:3;width:100%;overflow:auto;justify-content:flex-start}.hero{min-height:160px}}
@media(max-width:600px){main{padding:14px 10px 35px}.logo{width:125px;height:50px}.calendar{grid-template-columns:48px repeat(5,95px);overflow:auto}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>

<main>
<section class="hero"><div><h1>Welkom bij Autobedrijf Dull</h1><p>Eerlijk vakmanschap, duidelijkheid en zorg voor iedere auto.</p></div></section>
<div class="layout">
<aside class="panel"><h2>＋ Nieuwe afspraak</h2>
<label>Datum</label><input id="date" type="date"><label>Tijd</label><input id="time" type="time" value="09:00">
<label>Naam klant</label><input id="name" placeholder="Naam klant"><label>Telefoon</label><input id="phone" placeholder="Telefoonnummer">
<label>Voertuig</label><input id="vehicle" placeholder="Merk, model, kenteken"><label>Werkzaamheden</label><textarea id="work" placeholder="Bijv. APK, onderhoud, reparatie..."></textarea>
<button class="btn" onclick="addAppointment()">Afspraak toevoegen</button></aside>
<section><div class="panel"><div class="toolbar"><h2>Planning</h2><div><button onclick="shift(-1)">←</button> <button onclick="today()">Vandaag</button> <button onclick="shift(1)">→</button></div></div>
<div id="range" style="color:#bbb"></div><div class="calendar" id="cal"></div>
<div class="stats"><div class="stat">Vandaag<strong id="sToday">0</strong></div><div class="stat">Gepland<strong id="sPlanned">0</strong></div><div class="stat">Deze week<strong id="sWeek">0</strong></div></div></div>
<div class="panel" style="margin-top:16px"><h2>Afspraken</h2><div class="tablewrap"><table><thead><tr><th>Datum</th><th>Tijd</th><th>Klant</th><th>Voertuig</th><th>Werkzaamheden</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</div></main>
<script>
const KEY="dull-planning-v3";let items=JSON.parse(localStorage.getItem(KEY)||"[]");let anchor=new Date();anchor.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function monday(d){let x=new Date(d),day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){let start=monday(anchor),days=[];for(let i=0;i<5;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}
range.textContent=days[0].toLocaleDateString("nl-NL",{day:"numeric",month:"long"})+" – "+days[4].toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
let h='<div class="cell head">Tijd</div>'+days.map(d=>'<div class="cell head">'+d.toLocaleDateString("nl-NL",{weekday:"short"})+'<br>'+d.getDate()+' '+d.toLocaleDateString("nl-NL",{month:"short"})+'</div>').join("");
for(let hr=8;hr<=17;hr++){h+='<div class="cell time">'+pad(hr)+':00</div>';days.forEach(d=>{let a=items.filter(x=>x.date===iso(d)&&x.time.slice(0,2)==pad(hr));h+='<div class="cell">'+a.map(x=>'<div class="appt">'+esc(x.time)+' '+esc(x.name)+'<small>'+esc(x.work)+'</small></div>').join("")+'</div>'})}cal.innerHTML=h;
let now=iso(new Date()),week=days.map(iso);sToday.textContent=items.filter(x=>x.date===now).length;sPlanned.textContent=items.filter(x=>x.status!=="Klaar").length;sWeek.textContent=items.filter(x=>week.includes(x.date)).length;
rows.innerHTML=items.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.time)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.vehicle)+'</td><td>'+esc(x.work)+'</td><td><span class="badge">'+esc(x.status||"Gepland")+'</span></td></tr>').join("")||'<tr><td colspan="6">Nog geen afspraken.</td></tr>'}
function addAppointment(){if(!date.value||!name.value||!work.value){alert("Vul minimaal datum, klant en werkzaamheden in.");return}items.push({date:date.value,time:time.value,name:name.value,phone:phone.value,vehicle:vehicle.value,work:work.value,status:"Gepland"});localStorage.setItem(KEY,JSON.stringify(items));render();name.value=phone.value=vehicle.value=work.value=""}
function shift(n){anchor.setDate(anchor.getDate()+n*7);render()}function today(){anchor=new Date();anchor.setHours(0,0,0,0);render()}
date.value=iso(new Date());render();
</script></body></html>
