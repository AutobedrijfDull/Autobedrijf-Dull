<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autobedrijf Dull — Planning</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#111827;--line:#e5e7eb;--green:#16834b;--orange:#c56b00;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#111827;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:800}.date{font-size:14px;color:#d1d5db}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
nav{background:#fff;border-right:1px solid var(--line);padding:20px 14px}
nav button{width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-radius:9px;margin-bottom:5px;cursor:pointer;font-size:15px}
nav button.active,nav button:hover{background:#111827;color:#fff}
main{padding:26px;max-width:1400px;width:100%;margin:auto}
h1{margin:0 0 5px;font-size:28px}.sub{color:var(--muted);margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card .num{font-size:30px;font-weight:800}.label{color:var(--muted);font-size:13px;margin-top:4px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar-left{display:flex;gap:8px}
button.primary{background:#111827;color:#fff;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}
button.secondary{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer}
.schedule{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
.appointment{display:grid;grid-template-columns:80px 1fr 150px 110px;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.appointment:last-child{border-bottom:0}.time{font-weight:800}.customer{font-weight:700}.details{color:var(--muted);font-size:13px;margin-top:3px}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:7px 10px;text-align:center;background:#eef2ff;color:#3730a3}
.status.green{background:#eaf8f0;color:#167044}.status.orange{background:#fff5e6;color:#a65b00}
.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%}
.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{min-width:130px}.cards{grid-template-columns:repeat(2,1fr)}.appointment{grid-template-columns:60px 1fr}.appointment .status{grid-column:2}.appointment .service{display:none}}
</style>
</head>
<body>
<header><div class="logo">🚗 Autobedrijf Dull</div><div class="date" id="today"></div></header>
<div class="layout">
<nav>
<button class="active" onclick="show('dashboard',this)">Dashboard</button>
<button onclick="show('planning',this)">Planning</button>
<button onclick="openModal()">＋ Nieuwe afspraak</button>
</nav>
<main>
<section id="dashboard">
<h1>Goedemorgen 👋</h1><div class="sub">Dit is het overzicht van vandaag.</div>
<div class="cards">
<div class="card"><div class="num" id="countToday">0</div><div class="label">Afspraken vandaag</div></div>
<div class="card"><div class="num" id="countBusy">0</div><div class="label">In behandeling</div></div>
<div class="card"><div class="num" id="countDone">0</div><div class="label">Klaar</div></div>
<div class="card"><div class="num" id="countWeek">0</div><div class="label">Deze week</div></div>
</div>
<div class="toolbar"><h2>Planning vandaag</h2><button class="primary" onclick="openModal()">＋ Afspraak toevoegen</button></div>
<div class="schedule" id="dashboardList"></div>
</section>
<section id="planning" style="display:none">
<h1>Planning</h1><div class="sub">Alle afspraken in één overzicht.</div>
<div class="toolbar"><div class="toolbar-left"><button class="secondary" onclick="filterStatus('all')">Alles</button><button class="secondary" onclick="filterStatus('Gepland')">Gepland</button><button class="secondary" onclick="filterStatus('Bezig')">Bezig</button><button class="secondary" onclick="filterStatus('Klaar')">Klaar</button></div><button class="primary" onclick="openModal()">＋ Nieuwe afspraak</button></div>
<div class="schedule" id="planningList"></div>
</section>
</main></div>

<div class="modal" id="modal">
<div class="modalbox"><h2>Nieuwe afspraak</h2>
<form class="form" onsubmit="addAppointment(event)">
<div><label>Datum</label><input id="fdate" type="date" required></div>
<div><label>Tijd</label><input id="ftime" type="time" required></div>
<div><label>Klant</label><input id="fname" placeholder="Naam klant" required></div>
<div><label>Kenteken</label><input id="fplate" placeholder="Bijv. AB-12-CD" required></div>
<div><label>Werkzaamheden</label><input id="fservice" placeholder="Bijv. APK + onderhoud" required></div>
<div><label>Status</label><select id="fstatus"><option>Gepland</option><option>Bezig</option><option>Klaar</option></select></div>
<div class="actions"><button type="button" class="secondary" onclick="closeModal()">Annuleren</button><button class="primary">Opslaan</button></div>
</form></div></div>

<script>
const key='dullAppointments';
let appointments=JSON.parse(localStorage.getItem(key)||'[]');
let activeFilter='all';
const todayISO=new Date().toISOString().slice(0,10);
document.getElementById('today').textContent=new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('fdate').value=todayISO;

if(!appointments.length){
appointments=[
{date:todayISO,time:'08:30',name:'Jan de Vries',plate:'12-AB-34',service:'APK + onderhoud',status:'Bezig'},
{date:todayISO,time:'10:00',name:'S. Jansen',plate:'45-CD-67',service:'Remmen controleren',status:'Gepland'},
{date:todayISO,time:'13:30',name:'M. Bakker',plate:'89-EF-01',service:'Banden vervangen',status:'Gepland'},
{date:todayISO,time:'15:00',name:'P. Smit',plate:'23-GH-45',service:'Olie + filters',status:'Klaar'}
]; save();
}
function save(){localStorage.setItem(key,JSON.stringify(appointments))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
const filtered=appointments.filter(a=>activeFilter==='all'||a.status===activeFilter).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const today=appointments.filter(a=>a.date===todayISO).sort((a,b)=>a.time.localeCompare(b.time));
document.getElementById('countToday').textContent=today.length;
document.getElementById('countBusy').textContent=appointments.filter(a=>a.status==='Bezig').length;
document.getElementById('countDone').textContent=appointments.filter(a=>a.status==='Klaar').length;
const d=new Date(); const start=new Date(d); start.setDate(d.getDate()-d.getDay()+1); const end=new Date(start); end.setDate(start.getDate()+6);
document.getElementById('countWeek').textContent=appointments.filter(a=>{const x=new Date(a.date+'T00:00');return x>=start&&x<=end}).length;
document.getElementById('dashboardList').innerHTML=renderList(today,'Vandaag');
document.getElementById('planningList').innerHTML=renderList(filtered,'Planning');
}
function renderList(list,title){
if(!list.length)return `<div class="day">${title}</div><div class="empty">Geen afspraken gevonden.</div>`;
return `<div class="day">${title}</div>`+list.map((a,i)=>`<div class="appointment">
<div class="time">${esc(a.time)}<div class="details">${a.date.split('-').reverse().join('-')}</div></div>
<div><div class="customer">${esc(a.name)}</div><div class="details">${esc(a.plate)} · ${esc(a.service)}</div></div>
<div class="service"><span class="details">${esc(a.service)}</span></div>
<div><span class="status ${a.status==='Klaar'?'green':a.status==='Bezig'?'orange':''}">${esc(a.status)}</span></div>
</div>`).join('');
}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render()}
function filterStatus(s){activeFilter=s;render()}
function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('fdate').value=todayISO}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addAppointment(e){e.preventDefault();appointments.push({date:fdate.value,time:ftime.value,name:fname.value,plate:fplate.value.toUpperCase(),service:fservice.value,status:fstatus.value});save();closeModal();e.target.reset();document.getElementById('fdate').value=todayISO;render()}
render();
</script>
</body></html>
